name: Publish to npm

# Publishes the package to npm whenever a version tag (v1.2.3) is pushed, using
# npm Trusted Publishing (OIDC) — no NPM_TOKEN secret, no OTP. GitHub's OIDC
# identity is trusted by npm; provenance is attached automatically.
#
# ONE-TIME SETUP on npmjs.com (required before the first run):
#   npmjs.com → package "niimbot-web-bluetooth" → Settings → Trusted Publishing →
#   Add GitHub Actions publisher:
#     Repository:      iscarelli/niimbot-web-bluetooth
#     Workflow file:   release.yml
#     Environment:     (leave blank)
#
# Release flow after that: bump package.json (+ src/niimbot.js VERSION), commit,
#   git tag vX.Y.Z && git push origin vX.Y.Z   → this workflow publishes.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: # allow a manual run from the Actions tab

permissions:
  contents: write # create the GitHub Release (read is enough for the publish itself)
  id-token: write # REQUIRED for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1 (newer than what ships with Node).
      - name: Update npm
        run: npm install -g npm@latest

      # Guard: the pushed tag must match the version in package.json.
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # No dependencies / no build — just publish what's tracked at this tag.
      - name: Publish (OIDC, public, with provenance)
        run: npm publish --access public --provenance

      # A tag is not a release. Pushing v2.2.0 published the package while the repo's
      # front page still announced v1.3.5 for two months and four versions, because the
      # README's `github/v/release` badge reads the Releases page and nothing was
      # creating one. Half a trigger fails silently — nothing errors, the artefact just
      # never appears — so the release now happens in the same step that publishes.
      #
      # Notes come from CHANGELOG.md: the section for this exact version, which is the
      # record written when each task was retired. If the tag has no section the step
      # FAILS rather than shipping an empty release — a release that says nothing is
      # worse than the missing one, because it looks like the version did nothing.
      - name: Create the GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # No regex on purpose: in awk `~` binds tighter than concatenation, so the
          # obvious `$0 ~ "^## \\[" v "\\]"` silently matches the wrong thing and every
          # section comes back empty. index()==1 is unambiguous.
          awk -v h="## [$VER]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ "$(wc -l < notes.md)" -lt 2 ]; then
            echo "::error::CHANGELOG.md has no '## [$VER]' section — refusing to ship an empty release"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
