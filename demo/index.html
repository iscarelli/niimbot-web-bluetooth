<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>niimbot — demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    label { display: inline-block; margin: .4rem .6rem .4rem 0; }
    select, input { padding: .3rem; }
    button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { margin-top: 1rem; font-family: monospace; white-space: pre-wrap; }
    canvas { border: 1px solid #ccc; image-rendering: pixelated; max-width: 100%; margin-top: 1rem; }
    .warn { color: #b00; }

    /* Log panel. A phone has no console, so this is the only place a mobile
       tester can read (and copy) the driver's `writeMode=` line. It must never
       widen the page: long hex dumps wrap instead of scrolling sideways. */
    #logbox { margin-top: 1.2rem; border: 1px solid #ccc; border-radius: 4px; padding: .5rem .6rem; }
    #logbox summary { cursor: pointer; font-weight: 600; }
    #logbox summary span { font-weight: 400; color: #666; }
    .logctl { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .9rem; margin: .6rem 0 .5rem; }
    .logctl button { padding: .4rem .7rem; font-size: .85rem; }
    .logctl label { margin: 0; font-size: .85rem; }
    #log {
      margin: 0; padding: .5rem; background: #f6f6f6; border-radius: 3px;
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .72rem; line-height: 1.4;
      white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
      max-height: 45vh; overflow-y: auto; overflow-x: hidden;
    }
    #log .err { color: #b00; }
    /* Buttons are long ("Print 3 dense labels (stress)") — let them wrap and
       shrink rather than push the page wider than a ~380 px phone screen. */
    button { max-width: 100%; white-space: normal; }
    label input[type="text"], #text { max-width: 100%; }
  </style>
</head>
<body>
  <h1>niimbot — print demo</h1>
  <p>Prints a <strong>test label</strong> (frame + diagonals + text) straight
     from the browser via Web Bluetooth. Requires <strong>Chrome/Edge</strong>.</p>

  <div>
    <label>Model: <select id="model"></select></label>
    <label>Label: <select id="size"></select></label>
    <label>Text: <input id="text" value="NIIMBOT TEST" size="16"></label>
  </div>

  <button id="identify">Connect &amp; identify printer</button>
  <button id="disconnect">Disconnect</button>
  <button id="readstatus">Read status</button>
  <button id="print">Connect and print</button>
  <button id="print3copies">Print 3 copies (1 upload)</button>
  <button id="print3">Print 3-label batch</button>
  <button id="print3dense">Print 3 dense labels (stress)</button>
  <button id="print5dense">Print 5 dense labels (stress)</button>
  <div id="status"></div>
  <canvas id="preview"></canvas>

  <details id="logbox" open>
    <summary>Log <span id="logcount">(0 lines)</span></summary>
    <div class="logctl">
      <button id="logcopy" type="button">Copy log</button>
      <button id="logclear" type="button">Clear</button>
      <label><input type="checkbox" id="optpacing"> FORCE_PACING</label>
      <label><input type="checkbox" id="optdebug"> DEBUG (packet dump)</label>
    </div>
    <pre id="log"></pre>
  </details>

  <script>
    // Mirror console.log/.error into the panel above. Installed BEFORE the driver
    // <script> so the very first line (the version banner) is captured, and it
    // always forwards to the real console — this only adds a second sink.
    (function () {
      const pre = document.getElementById("log");
      const counter = document.getElementById("logcount");
      const real = { log: console.log.bind(console), error: console.error.bind(console) };
      const MAX = 600;          // cap the DOM; a dense DEBUG run emits thousands
      const lines = [];         // source of truth for "Copy log"

      const fmt = (a) => {
        if (typeof a === "string") return a;
        if (a instanceof Error) return a.message;
        try { return JSON.stringify(a); } catch (e) { return String(a); }
      };
      const stamp = () => {
        const t = new Date();
        const p = (n, w) => String(n).padStart(w || 2, "0");
        return `${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())}.${p(t.getMilliseconds(), 3)}`;
      };

      function append(kind, args) {
        const text = stamp() + "  " + Array.prototype.map.call(args, fmt).join(" ");
        lines.push(text);
        const div = document.createElement("div");
        if (kind === "error") div.className = "err";
        div.textContent = text;
        pre.appendChild(div);
        while (lines.length > MAX) { lines.shift(); pre.removeChild(pre.firstChild); }
        counter.textContent = `(${lines.length} line${lines.length === 1 ? "" : "s"})`;
        pre.scrollTop = pre.scrollHeight;
      }

      console.log = function () { real.log.apply(console, arguments); append("log", arguments); };
      console.error = function () { real.error.apply(console, arguments); append("error", arguments); };

      // Uncaught failures would otherwise be invisible on a phone.
      window.addEventListener("error", (e) => console.error("uncaught: " + (e.message || e)));
      window.addEventListener("unhandledrejection", (e) => {
        const r = e.reason;
        console.error("unhandled rejection: " + ((r && r.message) || r));
      });

      document.getElementById("logclear").addEventListener("click", () => {
        lines.length = 0; pre.textContent = ""; counter.textContent = "(0 lines)";
      });

      // Reading a trace off a phone screen is the whole problem, so copying it has
      // to work. execCommand is the fallback for a non-secure context, where
      // navigator.clipboard is undefined.
      document.getElementById("logcopy").addEventListener("click", async () => {
        const btn = document.getElementById("logcopy");
        const text = lines.join("\n");
        let ok = false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            ok = true;
          }
        } catch (e) { ok = false; }
        if (!ok) {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
          document.body.appendChild(ta);
          ta.select();
          try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
          document.body.removeChild(ta);
        }
        btn.textContent = ok ? "Copied ✓" : "Copy failed";
        setTimeout(() => { btn.textContent = "Copy log"; }, 1500);
      });
    })();
  </script>

  <script>
    // Cache-bust the driver during development so edits always load (the dev
    // server was returning 304s). Writes a <script> with a unique query string.
    document.write('<script src="../src/niimbot.js?t=' + Date.now() + '"><\/script>');
  </script>
  <script>
  (async function () {
    const $ = (id) => document.getElementById(id);
    const status = (s) => { $("status").textContent = s; };
    // Errors go to the log panel as well as the status line: on a phone the panel
    // is the only readable — and copyable — trace. (Progress deliberately does not,
    // or the one line that matters drowns in percentages.)
    const fail = (e) => {
      const m = (e && e.message) || e;
      console.error("error: " + m);
      status("error: " + m);
    };

    document.title = "niimbot demo — driver " + (Niimbot.VERSION || "?");
    console.log("[demo] loaded Niimbot driver version:", Niimbot.VERSION);

    // Both toggles exist so a mobile tester can flip them without a console.
    // DEBUG starts off on purpose: its packet dump buries the `writeMode=` line.
    Niimbot.DEBUG = false;
    $("optdebug").checked = Niimbot.DEBUG;
    $("optpacing").checked = Niimbot.FORCE_PACING;
    $("optdebug").addEventListener("change", () => {
      Niimbot.DEBUG = $("optdebug").checked;
      console.log("[demo] Niimbot.DEBUG =", Niimbot.DEBUG);
    });
    // Read per write, so flipping it mid-connection takes effect immediately.
    $("optpacing").addEventListener("change", () => {
      Niimbot.FORCE_PACING = $("optpacing").checked;
      console.log("[demo] Niimbot.FORCE_PACING =", Niimbot.FORCE_PACING);
    });

    if (!Niimbot.isSupported()) {
      $("status").innerHTML = '<span class="warn">Web Bluetooth unavailable — use Chrome/Edge over HTTPS or localhost.</span>';
      $("print").disabled = true;
    }

    const reg = await fetch("../registry.json").then((r) => r.json());
    for (const [k, m] of Object.entries(reg.models)) {
      const o = new Option(m.label, k, k === reg.default_model, k === reg.default_model);
      $("model").add(o);
    }

    // Sizes are calibrated per dpi, so only offer those matching the selected
    // model (a B1 50×30 has different pixels than a B1 Pro 50×30). Keep the
    // current pick if it's still valid, else fall back to the default/first.
    function populateSizes() {
      const dpi = reg.models[$("model").value].dpi;
      const prev = $("size").value;
      $("size").innerHTML = "";
      let selected = null;
      for (const [k, s] of Object.entries(reg.sizes)) {
        if (s.dpi != null && dpi != null && s.dpi !== dpi) continue;
        $("size").add(new Option(s.label, k));
        if (k === prev || (selected === null && k === reg.default_size)) selected = k;
      }
      $("size").value = selected || $("size").options[0].value;
    }
    populateSizes();
    $("model").addEventListener("change", () => { populateSizes(); refresh(); });

    // `light` skips the corner-to-corner diagonals. The diagonals touch nearly every
    // row, so they defeat run-length and blow the packet count up to ~one-per-row
    // (worst case for send time). A realistic label (frame + text, mostly white)
    // collapses to a few dozen packets — use light=true to validate continuous
    // multi-label flow without the pathological diagonals.
    function drawTest(size, text, target, light) {
      const c = target || $("preview");
      c.width = size.w_px; c.height = size.h_px;
      const x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
      x.strokeStyle = "#000"; x.lineWidth = 3;
      const m = size.margin || 10;
      x.strokeRect(m, m, c.width - 2 * m, c.height - 2 * m);
      if (!light) {
        x.beginPath();
        x.moveTo(m, m); x.lineTo(c.width - m, c.height - m);
        x.moveTo(c.width - m, m); x.lineTo(m, c.height - m);
        x.stroke();
      }
      x.fillStyle = "#000";
      x.font = `bold ${Math.round(size.h_px * 0.16)}px sans-serif`;
      x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(text, c.width / 2, c.height / 2);
      return c;
    }

    // Worst case for the driver: random 1px noise makes every row a unique 0x85
    // row (no run-length savings) with ~half its bytes set — maximum data volume
    // and maximum bytes buffered ahead. A big readable number stays on top so you
    // can still confirm order and that the label printed intact.
    function drawDense(size, label, target) {
      const c = target || $("preview");
      c.width = size.w_px; c.height = size.h_px;
      const x = c.getContext("2d");
      const img = x.createImageData(c.width, c.height);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() < 0.5 ? 0 : 255;
        d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
      }
      x.putImageData(img, 0, 0);
      // White plate + black number so it survives the noise and stays legible.
      const fs = Math.round(size.h_px * 0.5);
      x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height * 0.55);
      x.fillStyle = "#000"; x.font = `bold ${fs}px sans-serif`;
      x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(label, c.width / 2, c.height * 0.28);
      return c;
    }

    function refresh() {
      const size = reg.sizes[$("size").value];
      drawTest(size, $("text").value);
    }
    $("size").addEventListener("change", refresh);
    $("text").addEventListener("input", refresh);
    refresh();

    // Connect and ask the printer which model it is (B1 and B1 Pro share the BLE
    // name), then auto-select the matching registry model + size — like niim.blue.
    $("identify").addEventListener("click", async () => {
      $("identify").disabled = true;
      try {
        status("connecting… (pick your printer from the chooser)");
        // Filter the chooser to the union of all known model name prefixes, so it
        // lists only Niimbot printers we recognise but still finds any of them.
        const sel = reg.models[$("model").value];
        const allPrefixes = [...new Set(Object.values(reg.models).flatMap((m) => m.name_prefixes || []))];
        const info = await Niimbot.identify({ ...sel, name_prefixes: allPrefixes });
        let matched = null;
        for (const [k, m] of Object.entries(reg.models)) if (m.id === info.modelId) matched = k;
        const detail = `id ${info.modelId}, protocol v${info.protocolVersion}, BLE name "${info.deviceName || "?"}"`;
        if (matched) {
          $("model").value = matched;
          populateSizes();
          refresh();
          status(`Identified: ${info.label} — ${detail}. Model "${matched}" selected.`);
        } else {
          status(`Identified: ${info.label} — ${detail}. No matching model in registry — selection left as is.`);
        }
      } catch (e) {
        fail(e);
      } finally {
        $("identify").disabled = false;
      }
    });

    // Drop the connection so you can pair a different printer (e.g. switch B1 ↔ B1 Pro).
    $("disconnect").addEventListener("click", async () => {
      try {
        await Niimbot.disconnect();
        status("disconnected — pick a printer and identify again.");
      } catch (e) {
        fail(e);
      }
    });

    // Consumable status. The decoded fields come from niimbluelib's layouts and are
    // NOT confirmed on hardware, so what matters here is the HEX DUMP of `raw`: paste
    // it (Copy log) next to what the printer physically shows — lid open/shut, paper
    // in/out, tag present — and the layout can be settled for real. Nothing in the
    // print path reads any of this.
    $("readstatus").addEventListener("click", async () => {
      $("readstatus").disabled = true;
      try {
        status("reading status…");
        const st = await Niimbot.getStatus();
        const dump = (u8) => (u8 ? Array.from(u8).map((b) => b.toString(16).padStart(2, "0")).join(" ") : "(no answer)");
        console.log(`[status] confidence=${st.confidence}`);
        console.log(`[status] raw heartbeat (resp ${st.raw.heartbeatCmd != null ? "0x" + st.raw.heartbeatCmd.toString(16) : "—"}): ${dump(st.raw.heartbeat)}`);
        console.log(`[status] raw rfid: ${dump(st.raw.rfid)}`);
        console.log(`[status] decoded: ${JSON.stringify(st.decoded)}`);
        const hb = st.decoded && st.decoded.heartbeat;
        status(hb
          ? `status (unvalidated): lid ${hb.lidClosed ? "closed" : "open"}, paper ${hb.paperInserted ? "in" : "out"}, charge ${hb.chargeLevel}. See the log for the raw dump.`
          : "status read — layout not recognised, raw bytes are in the log.");
      } catch (e) {
        fail(e);
      } finally {
        $("readstatus").disabled = false;
      }
    });

    $("print").addEventListener("click", async () => {
      const model = reg.models[$("model").value];
      const size = reg.sizes[$("size").value];
      const canvas = drawTest(size, $("text").value);
      $("print").disabled = true;
      try {
        await Niimbot.printImage(canvas.toDataURL("image/png"), { model, size, onProgress: status });
        status("ok — label sent.");
      } catch (e) {
        fail(e);
      } finally {
        $("print").disabled = false;
      }
    });

    // niim.blue's fast path: ONE image upload, printer repeats it `copies` times.
    // Use this whenever the labels are identical — the data crosses BLE only once.
    $("print3copies").addEventListener("click", async () => {
      const model = reg.models[$("model").value];
      const size = reg.sizes[$("size").value];
      const canvas = drawTest(size, $("text").value);
      $("print3copies").disabled = true;
      try {
        await Niimbot.printImage(canvas.toDataURL("image/png"), { model, size, copies: 3, onProgress: status });
        status("ok — 3 copies (single upload) sent.");
      } catch (e) {
        fail(e);
      } finally {
        $("print3copies").disabled = false;
      }
    });

    $("print3").addEventListener("click", async () => {
      const model = reg.models[$("model").value];
      const size = reg.sizes[$("size").value];
      // 3 distinct labels so the print order — and the absence of a retract
      // between them — is obvious on the paper. Realistic (light) labels so the
      // non-copies path streams continuously; the dense buttons cover worst case.
      const off = document.createElement("canvas");
      const urls = [1, 2, 3].map((n) => {
        drawTest(size, `${$("text").value} #${n}`, off, true);
        return off.toDataURL("image/png");
      });
      $("print").disabled = true; $("print3").disabled = true;
      try {
        await Niimbot.printBatch(urls, { model, size, onProgress: status });
        status("ok — 3-label batch sent.");
      } catch (e) {
        fail(e);
      } finally {
        $("print").disabled = false; $("print3").disabled = false;
        refresh();
      }
    });

    // Worst-case stress: `count` dense noise labels at the selected size. Pick your
    // LARGEST label here to push the most data through the look-ahead pipeline.
    async function runDense(count) {
      const model = reg.models[$("model").value];
      const size = reg.sizes[$("size").value];
      const off = document.createElement("canvas");
      const urls = [];
      for (let n = 1; n <= count; n++) {
        drawDense(size, String(n), off);
        urls.push(off.toDataURL("image/png"));
      }
      const btns = ["print", "print3", "print3dense", "print5dense"];
      btns.forEach((b) => ($(b).disabled = true));
      try {
        await Niimbot.printBatch(urls, { model, size, onProgress: status });
        status(`ok — ${count} dense labels sent.`);
      } catch (e) {
        fail(e);
      } finally {
        btns.forEach((b) => ($(b).disabled = false));
        refresh();
      }
    }

    $("print3dense").addEventListener("click", () => runDense(3));
    $("print5dense").addEventListener("click", () => runDense(5));
  })();
  </script>
</body>
</html>
