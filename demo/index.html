<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>niimbot — demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    label { display: inline-block; margin: .4rem .6rem .4rem 0; }
    select, input { padding: .3rem; }
    button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { margin-top: 1rem; font-family: monospace; white-space: pre-wrap; }
    canvas { border: 1px solid #ccc; image-rendering: pixelated; max-width: 100%; margin-top: 1rem; }
    .warn { color: #b00; }
  </style>
</head>
<body>
  <h1>niimbot — print demo</h1>
  <p>Prints a <strong>test label</strong> (frame + diagonals + text) straight
     from the browser via Web Bluetooth. Requires <strong>Chrome/Edge</strong>.</p>

  <div>
    <label>Model: <select id="model"></select></label>
    <label>Label: <select id="size"></select></label>
    <label>Text: <input id="text" value="NIIMBOT TEST" size="16"></label>
  </div>

  <button id="print">Connect and print</button>
  <button id="print3copies">Print 3 copies (1 upload)</button>
  <button id="print3">Print 3-label batch</button>
  <button id="print3dense">Print 3 dense labels (stress)</button>
  <button id="print5dense">Print 5 dense labels (stress)</button>
  <div id="status"></div>
  <canvas id="preview"></canvas>

  <script>
    // Cache-bust the driver during development so edits always load (the dev
    // server was returning 304s). Writes a <script> with a unique query string.
    document.write('<script src="../src/niimbot.js?t=' + Date.now() + '"><\/script>');
  </script>
  <script>
  (async function () {
    const $ = (id) => document.getElementById(id);
    const status = (s) => { $("status").textContent = s; };

    document.title = "niimbot demo — driver " + (Niimbot.VERSION || "?");
    console.log("[demo] loaded Niimbot driver version:", Niimbot.VERSION);

    if (!Niimbot.isSupported()) {
      $("status").innerHTML = '<span class="warn">Web Bluetooth unavailable — use Chrome/Edge over HTTPS or localhost.</span>';
      $("print").disabled = true;
    }

    const reg = await fetch("../registry.json").then((r) => r.json());
    for (const [k, m] of Object.entries(reg.models)) {
      const o = new Option(m.label, k, k === reg.default_model, k === reg.default_model);
      $("model").add(o);
    }

    // Sizes are calibrated per dpi, so only offer those matching the selected
    // model (a B1 50×30 has different pixels than a B1 Pro 50×30). Keep the
    // current pick if it's still valid, else fall back to the default/first.
    function populateSizes() {
      const dpi = reg.models[$("model").value].dpi;
      const prev = $("size").value;
      $("size").innerHTML = "";
      let selected = null;
      for (const [k, s] of Object.entries(reg.sizes)) {
        if (s.dpi != null && dpi != null && s.dpi !== dpi) continue;
        $("size").add(new Option(s.label, k));
        if (k === prev || (selected === null && k === reg.default_size)) selected = k;
      }
      $("size").value = selected || $("size").options[0].value;
    }
    populateSizes();
    $("model").addEventListener("change", () => { populateSizes(); refresh(); });

    // `light` skips the corner-to-corner diagonals. The diagonals touch nearly every
    // row, so they defeat run-length and blow the packet count up to ~one-per-row
    // (worst case for send time). A realistic label (frame + text, mostly white)
    // collapses to a few dozen packets — use light=true to validate continuous
    // multi-label flow without the pathological diagonals.
    function drawTest(size, text, target, light) {
      const c = target || $("preview");
      c.width = size.w_px; c.height = size.h_px;
      const x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
      x.strokeStyle = "#000"; x.lineWidth = 3;
      const m = size.margin || 10;
      x.strokeRect(m, m, c.width - 2 * m, c.height - 2 * m);
      if (!light) {
        x.beginPath();
        x.moveTo(m, m); x.lineTo(c.width - m, c.height - m);
        x.moveTo(c.width - m, m); x.lineTo(m, c.height - m);
        x.stroke();
      }
      x.fillStyle = "#000";
      x.font = `bold ${Math.round(size.h_px * 0.16)}px sans-serif`;
      x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(text, c.width / 2, c.height / 2);
      return c;
    }

    // Worst case for the driver: random 1px noise makes every row a unique 0x85
    // row (no run-length savings) with ~half its bytes set — maximum data volume
    // and maximum bytes buffered ahead. A big readable number stays on top so you
    // can still confirm order and that the label printed intact.
    function drawDense(size, label, target) {
      const c = target || $("preview");
      c.width = size.w_px; c.height = size.h_px;
      const x = c.getContext("2d");
      const img = x.createImageData(c.width, c.height);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() < 0.5 ? 0 : 255;
        d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
      }
      x.putImageData(img, 0, 0);
      // White plate + black number so it survives the noise and stays legible.
      const fs = Math.round(size.h_px * 0.5);
      x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height * 0.55);
      x.fillStyle = "#000"; x.font = `bold ${fs}px sans-serif`;
      x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(label, c.width / 2, c.height * 0.28);
      return c;
    }

    function refresh() {
      const size = reg.sizes[$("size").value];
      drawTest(size, $("text").value);
    }
    $("size").addEventListener("change", refresh);
    $("text").addEventListener("input", refresh);
    refresh();

    $("print").addEventListener("click", async () => {
      const model = reg.models[$("model").value];
      const size = reg.sizes[$("size").value];
      const canvas = drawTest(size, $("text").value);
      $("print").disabled = true;
      try {
        await Niimbot.printImage(canvas.toDataURL("image/png"), { model, size, onProgress: status });
        status("ok — label sent.");
      } catch (e) {
        status("error: " + (e && e.message || e));
      } finally {
        $("print").disabled = false;
      }
    });

    // niim.blue's fast path: ONE image upload, printer repeats it `copies` times.
    // Use this whenever the labels are identical — the data crosses BLE only once.
    $("print3copies").addEventListener("click", async () => {
      const model = reg.models[$("model").value];
      const size = reg.sizes[$("size").value];
      const canvas = drawTest(size, $("text").value);
      $("print3copies").disabled = true;
      try {
        await Niimbot.printImage(canvas.toDataURL("image/png"), { model, size, copies: 3, onProgress: status });
        status("ok — 3 copies (single upload) sent.");
      } catch (e) {
        status("error: " + (e && e.message || e));
      } finally {
        $("print3copies").disabled = false;
      }
    });

    $("print3").addEventListener("click", async () => {
      const model = reg.models[$("model").value];
      const size = reg.sizes[$("size").value];
      // 3 distinct labels so the print order — and the absence of a retract
      // between them — is obvious on the paper. Realistic (light) labels so the
      // non-copies path streams continuously; the dense buttons cover worst case.
      const off = document.createElement("canvas");
      const urls = [1, 2, 3].map((n) => {
        drawTest(size, `${$("text").value} #${n}`, off, true);
        return off.toDataURL("image/png");
      });
      $("print").disabled = true; $("print3").disabled = true;
      try {
        await Niimbot.printBatch(urls, { model, size, onProgress: status });
        status("ok — 3-label batch sent.");
      } catch (e) {
        status("error: " + (e && e.message || e));
      } finally {
        $("print").disabled = false; $("print3").disabled = false;
        refresh();
      }
    });

    // Worst-case stress: `count` dense noise labels at the selected size. Pick your
    // LARGEST label here to push the most data through the look-ahead pipeline.
    async function runDense(count) {
      const model = reg.models[$("model").value];
      const size = reg.sizes[$("size").value];
      const off = document.createElement("canvas");
      const urls = [];
      for (let n = 1; n <= count; n++) {
        drawDense(size, String(n), off);
        urls.push(off.toDataURL("image/png"));
      }
      const btns = ["print", "print3", "print3dense", "print5dense"];
      btns.forEach((b) => ($(b).disabled = true));
      try {
        await Niimbot.printBatch(urls, { model, size, onProgress: status });
        status(`ok — ${count} dense labels sent.`);
      } catch (e) {
        status("error: " + (e && e.message || e));
      } finally {
        btns.forEach((b) => ($(b).disabled = false));
        refresh();
      }
    }

    $("print3dense").addEventListener("click", () => runDense(3));
    $("print5dense").addEventListener("click", () => runDense(5));
  })();
  </script>
</body>
</html>
